# Builds the runtime as fefw_rt.dll (+ fefw_rt.lib and the ASTC decoder DLLs), as game-build/scripts/make-release.ps1 expects it,
# on GitHub's Windows runners. Download the "fefw_rt" artifact of a run and put fefw_rt.dll (and astcdec-*.dll) next to fefw.exe and
# fefw_rt.lib into tools\build\sdk\ of an installed release, then run Set up (the new runtime makes it link fefw.exe again).
name: Build fefw_rt

on:
  push:
    branches: ['claude/**', 'master']
  pull_request:
  workflow_dispatch:

jobs:
  fefw_rt:
    runs-on: windows-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: LLVM 23 or newer (clang-cl)
        shell: pwsh
        run: |
          $cl = 'C:\Program Files\LLVM\bin\clang-cl.exe'
          $v = 0
          if (Test-Path $cl) { if ((& $cl --version | Select-Object -First 1) -match 'version (\d+)') { $v = [int]$Matches[1] } }
          Write-Output "installed clang-cl major version: $v"
          if ($v -lt 23) { choco upgrade llvm -y --no-progress; if ($LASTEXITCODE) { exit $LASTEXITCODE } }
          & $cl --version
          if ((& $cl --version | Select-Object -First 1) -match 'version (\d+)' -and [int]$Matches[1] -lt 23) {
            Write-Output "::warning::clang-cl is older than the LLVM 23 docs/BUILDING.md asks for"
          }

      - name: Ninja
        shell: pwsh
        run: |
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) { choco install ninja -y --no-progress }
          ninja --version

      - name: Texture transcoder (third-party sources, ISPC build)
        shell: pwsh
        run: |
          pwsh -File tools/textures/scripts/fetch_third_party.ps1
          pwsh -File tools/textures/scripts/build.ps1 -Ispc -Jobs 4

      - name: fefw_rt.dll
        shell: pwsh
        run: pwsh -File game-build/scripts/build_fefw.ps1 -Target fefw_rt -BuildDir build/rtdll -CMakeArgs "-DFEFW_RT_DLL=ON" -Jobs 4

      - name: Name profiler addresses (temporary)
        shell: cmd
        run: |
          call runtime\scripts\env.cmd
          python .github\rt-map\resolve.py game-build\fefw\build\rtdll\fefw_rt.map game-build\fefw\build\rtdll\fefw_rt.dll "%NX_LLVM_BIN%\llvm-undname.exe" .github\rt-map\addrs.txt

      - name: PGO check (profile_flush writes the counters; the stub links without the profile runtime)
        shell: cmd
        run: |
          call runtime\scripts\env.cmd
          mkdir pgo-check && cd pgo-check
          clang-cl /nologo /O1 /EHsc /std:c++20 -I..\runtime\include -fprofile-instr-generate ..\.github\pgo-check\pgo_check.cpp ..\runtime\src\core\pgo.cpp /Fe:instr.exe /link /LIBPATH:"%NX_LLVM_BIN%\..\lib\clang\23\lib\windows" /LIBPATH:"%NX_LLVM_BIN%\..\lib\clang\23\lib\x86_64-pc-windows-msvc" || exit /b 1
          set LLVM_PROFILE_FILE=%CD%\check-%%p.profraw
          instr.exe || exit /b 1
          dir *.profraw || exit /b 1
          "%NX_LLVM_BIN%\llvm-profdata.exe" merge -o check.profdata check-*.profraw || exit /b 1
          "%NX_LLVM_BIN%\llvm-profdata.exe" show --function=hot --counts check.profdata || exit /b 1
          clang-cl /nologo /O1 /EHsc /std:c++20 -I..\runtime\include ..\.github\pgo-check\pgo_check.cpp ..\runtime\src\core\pgo.cpp /Fe:plain.exe || exit /b 1
          plain.exe || exit /b 1
          clang-cl /nologo /O1 /EHsc /std:c++20 -I..\runtime\include -fprofile-instr-use=check.profdata ..\.github\pgo-check\pgo_check.cpp ..\runtime\src\core\pgo.cpp /Fe:use.exe || exit /b 1

      - uses: actions/upload-artifact@v4
        with:
          name: fefw_rt
          if-no-files-found: error
          path: |
            game-build/fefw/build/rtdll/fefw_rt.dll
            game-build/fefw/build/rtdll/fefw_rt.lib
            game-build/fefw/build/rtdll/fefw_rt.map
            game-build/fefw/build/rtdll/astcdec-*.dll
