[package]
name = "fefw-launcher"
version = "0.2.0"
description = "Launcher for the fefw static recompilation: set up from your own dump, build, configure and play"
edition = "2021"
authors = ["Goldoire"]
license = "GPL-3.0-or-later"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zstd = "0.13"
sha2 = "0.10"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
