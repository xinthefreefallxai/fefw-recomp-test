# --- row help texts ---
0 keeps the SDR look, 1 lets highlights reach the peak, 2 pushes them further. = 0 保持 SDR 观感，1 让高光达到峰值，2 进一步推高。
1 is the sharpest. = 1 最锐利。
30 is the game's own. 60 runs gameplay at 60 at the right speed (dialogue text types twice as fast). 120 needs a frame limit of 120 or more and a fast PC; frame-counted effects such as the dialogue typing run 4 times as fast. = 30 是游戏原本的帧率。60 以正确速度跑 60 帧游玩（对话打字速度快一倍）。120 需要帧数上限不低于 120 且电脑够快；按帧计数的效果（如对话打字）会快 4 倍。
A log line with the game clock's speed every this many seconds ([fefw] clock_log); 0 is off. = 每隔这么多秒写一行游戏时钟速度的日志（[fefw] clock_log）；0 为关闭。
A small frame rate counter in a corner. The hotkey flips it in the game. = 在角落显示一个小帧率计数器。热键可在游戏内开关。
Analog trigger travel that counts as ZL / ZR pressed. = 模拟扳机行程达到多少才算按下 ZL / ZR。
Borderless fullscreen keeps the desktop resolution and switches at once; exclusive takes over the display. Alt+Enter flips windowed and fullscreen. = 无边框全屏保持桌面分辨率并立即切换；独占全屏会接管显示器。Alt+Enter 在窗口与全屏之间切换。
By label: the button printed A is the Switch A (Xbox layout). By position: the bottom button is the Switch B, as on a Switch pad. = 按印字：印着 A 的键就是 Switch 的 A（Xbox 布局）。按位置：底部那个键就是 Switch 的 B，与 Switch 手柄一致。
Everything the game plays. = 游戏播放的所有声音。
HDR10 or scRGB; Auto picks HDR10 when the display offers it. = HDR10 或 scRGB；自动会在显示器支持时选 HDR10。
How far the stick moves before it counts, as a share of its travel. = 摇杆要移动多远才开始计数，占其行程的比例。
How the game's output (Graphics > Output size) is scaled to the window when they differ. FSR 1 and NIS sharpen while they enlarge; a smaller window is always averaged. = 当游戏输出（图像 > 输出尺寸）与窗口尺寸不同时，如何缩放到窗口。FSR 1 与 NIS 在放大的同时锐化；窗口更小时一律做平均采样。
Lower it if the stick never reaches full speed (it tops out early). = 如果摇杆推到底也达不到满速（提前到达上限），就把它调低。
NVIDIA Reflex or AMD Anti-Lag 2, whichever the GPU has. Keep it off with frame generation. = NVIDIA Reflex 或 AMD Anti-Lag 2，取显卡支持的那个。使用帧生成时请保持关闭。
Neutral is the game's own picture; Vivid adds a little contrast and colour. = 中性是游戏原本的画面；鲜艳会略微增加对比度与色彩。
Off keeps SDR; Auto uses HDR when the display and Windows offer it; On runs the HDR pipeline anyway; Native uses the levels the game declares for an HDR TV. = 关闭保持 SDR；自动在显示器与 Windows 都支持时使用 HDR；开启则强制走 HDR 流程；原生使用游戏为 HDR 电视声明的电平。
Off stretches the picture to the window. = 关闭会把画面拉伸填满窗口。
Off: no forced vsync, the lowest latency; works with G-Sync / FreeSync and the frame limit. On: the display paces. = 关闭：不强制垂直同步，延迟最低；可与 G-Sync / FreeSync 及帧数上限配合。开启：由显示器决定节奏。
One line of Reflex / Anti-Lag timings a second ([latency] log_timings in controls.ini). = 每秒写一行 Reflex / Anti-Lag 耗时日志（controls.ini 里的 [latency] log_timings）。
Refresh rate follows the display. The game's own pace (30 / 60 / 120) still holds under it. = 刷新率跟随显示器。游戏自身的节奏（30 / 60 / 120）仍然在其下生效。
Screenshots leave the counter out unless this is on. = 除非开启此项，截图里不会包含计数器。
Silent while the window is not in focus. = 窗口不在前台时静音。
The client size in windowed mode. It changes at once while windowed; in fullscreen it is the size the window goes back to. = 窗口模式下的客户区尺寸。窗口模式下立即变化；全屏时它是退回窗口后的尺寸。
The display the window moves to; the fullscreen modes use it. = 窗口移动到的显示器；全屏模式也用它。
The game opens its audio device once. = 游戏只打开一次音频设备。
The language of the game's text and voices. Automatic uses your Windows display language when the game has it, else English. It applies the next time the game starts. [tweaks] language in controls.ini; [system] language in fefw.ini wins over it. = 游戏文本与语音的语言。自动会使用你的 Windows 显示语言（若游戏支持），否则用英文。下次启动游戏时生效。controls.ini 里的 [tweaks] language；fefw.ini 里的 [system] language 优先级更高。
The lowest level written to the log ([log] level). = 写入日志的最低级别（[log] level）。
The same for the right stick (the camera). = 右摇杆（镜头）的同一设置。
The size the game renders its picture, UI and post effects at (its DLSS output). Up to 3840 x 2160 at 16:9; wider shapes need Ultrawide. The window scales it (Display > Scaling to the window). = 游戏渲染画面、UI 与后处理效果的尺寸（即其 DLSS 输出）。16:9 下最高 3840 x 2160；更宽的画幅需要开超宽屏。窗口会缩放它（显示 > 缩放到窗口）。
Which button icons the game shows ([prompts] style). = 游戏显示哪种按键图标（[prompts] style）。
[fps] key in controls.ini. = controls.ini 里的 [fps] 键。

