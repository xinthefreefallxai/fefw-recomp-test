Running: %s; frame generation %s. = 运行中：%s；帧生成 %s。
Files found: DLSS %s, DLSS-G %s, FSR 3 upscaling %s, FSR 3 frame generation %s, XeSS %s. = 找到的文件：DLSS %s，DLSS-G %s，FSR 3 超分 %s，FSR 3 帧生成 %s，XeSS %s。
Frame generation works best with vsync and low latency off (Frame rate tab). With vsync on, the game renders at most half the display's refresh rate. = 帧生成在垂直同步与低延迟都关闭时效果最好（「帧率」页）。开启垂直同步后，游戏最多只按显示器刷新率的一半渲染。
%d fps gameplay raises this limit to %d fps while it is on (the setting itself stays %d). = %d fps 玩法会在开启期间把此上限提高到 %d fps（设置本身仍为 %d）。
%d fps gameplay is held to %.0f fps by %s: use a faster display, or turn vsync off and set a limit of %d or more.	%d fps 玩法被限制在 %.0f fps（原因：%s）：请换更快的显示器，或关闭垂直同步并把上限设为 %d 以上。
