Nits of ordinary white; 0 = Windows' SDR content brightness (203 without it).	普通白色的尼特值；0 = 使用 Windows 的 SDR 内容亮度（未设置时为 203）。
Nits of the brightest highlights; 0 = what the display reports.	最亮高光的尼特值；0 = 采用显示器上报的数值。
Not installed: the output is 16:9 or narrower, or [fefw] ultrawide = off.	未启用：输出为 16:9 或更窄，或 [fefw] ultrawide = off。
The last %d presented frames; the scale tops out at %.0f ms (16.7 ms = 60 fps, 33.3 ms = 30 fps).	最近 %d 个已呈现帧；刻度上限 %.0f ms（16.7 ms = 60 fps，33.3 ms = 30 fps）。
[fefw] render = WxH wins over the render scale. Clear it to use the scale.	[fefw] render = 宽x高 优先于渲染比例。清空它才会使用渲染比例。
Render scale	渲染比例
Shadow resolution	阴影贴图尺寸
Smooth time step	平滑时间步进
Contrast	对比度
Saturation	饱和度
Black level	黑位
Gamma	伽马
restart	重启
Spreads the tones from mid grey; 1 is the game's own.	以中间灰为基准拉开明暗；1 为游戏原值。
Colour intensity; 0 is grey, 1 the game's own.	色彩浓淡；0 为灰色，1 为游戏原值。
Below 0 pulls dark tones to black, above 0 lifts them.	低于 0 把暗部压向纯黑，高于 0 则抬亮暗部。
Mid-tone brightness: above 1 brightens.	中间调亮度：大于 1 更亮。
Neutral is the game's own picture; Vivid adds a little contrast and colour.	中性即游戏原生画面；鲜艳会增加一点对比度和色彩。
Mouse = 鼠标
An output wider than 16:9 (21:9, 32:9, or a wide window with Output size = the window's size) widens the 3D view and keeps the menus, HUD, text and movies in the centred 16:9 area, after Kompas9's ultrawide patch. A narrower output (16:10) gets the 16:9 picture letterboxed. Off: the game's 16:9 picture is stretched to a wide output.	宽于 16:9 的输出（21:9、32:9，或窗口很宽且「输出分辨率」设为窗口尺寸）会拓宽 3D 视野，并把菜单、HUD、文字与影片留在居中的 16:9 区域内 —— 采用 Kompas9 的超宽屏补丁。输出更窄（16:10）时，16:9 画面会加上黑边。关闭：把游戏的 16:9 画面拉伸到宽屏输出。
The 3D render size per side as a share of the output; the game's upscaler (Graphics > Upscaler) fills the rest. 100% renders at the output size and only anti-aliases. = 3D 渲染尺寸相对输出的比例（按单边计算）；其余由游戏的放大器（「图像」页 > 画面放大器）补齐。100% 表示按输出尺寸渲染，此时只做抗锯齿。
The shadow map's base size. Larger is sharper and costs GPU time and memory (8192: about 1.3 GB more). = 阴影贴图的基础尺寸。越大越清晰，但会占用更多 GPU 时间与显存（8192 约多占 1.3 GB）。
Quality = 画质
Docked gives every render configuration the docked one's shadows and effects, so a handheld or 1080p answer keeps them. = 「始终使用底座画质」会让每种渲染配置都采用底座模式的阴影与特效，这样掌机模式或 1080p 的配置也能保留它们。
What answers the game's DLSS calls. TAAU needs nothing; DLSS needs an RTX GPU and the Streamline DLLs ([upscale] dlss_dll); FSR 3 runs on any GPU with AMD's FidelityFX DLLs (upscalers\fsr next to the launcher, or [upscale] fsr_dll); XeSS runs on any GPU with DP4a (best on Intel Arc) and needs libxess.dll (upscalers\xess next to the launcher, or [upscale] xess_dll) and the Visual C++ 2015-2022 runtime. One that cannot run falls back to TAAU and the log names the missing file. Choosing DLSS or XeSS (or Auto with the DLLs present) takes effect at the next start. = 决定由谁来响应游戏发起的 DLSS 调用。TAAU 不需要任何额外文件；DLSS 需要 RTX 显卡与 Streamline 的 DLL（[upscale] dlss_dll）；FSR 3 在任何显卡上都能跑，需要 AMD 的 FidelityFX DLL（放在启动器旁的 upscalers\fsr，或由 [upscale] fsr_dll 指定）；XeSS 在支持 DP4a 的任意显卡上都能跑（Intel Arc 效果最好），需要 libxess.dll（放在启动器旁的 upscalers\xess，或由 [upscale] xess_dll 指定）以及 Visual C++ 2015-2022 运行库。跑不起来的那一项会回退到 TAAU，日志里会写出缺的是哪个文件。选择 DLSS 或 XeSS（或在 DLL 齐备时选「自动」）会在下次启动生效。
FSR 3 sharpening = FSR 3 锐化
TAAU history = TAAU 历史帧
How much of the history TAAU keeps: higher is smoother and slower to follow change. = TAAU 保留多少历史帧：数值越高画面越平滑，但跟随变化越慢。
One generated frame per rendered frame; the HUD is taken from the real frame. Keep vsync and low latency off. DLSS-G needs an RTX 40 or newer GPU, the Streamline DLLs (with the five frame generation adds) and Windows' hardware-accelerated GPU scheduling; FSR 3 runs on any GPU and needs amd_fidelityfx_vk.dll v1.1.4 (in upscalers\fsr next to the launcher). = 每个渲染帧生成一帧；HUD 取自真实帧。请保持垂直同步与低延迟关闭。DLSS-G 需要 RTX 40 系或更新的显卡、Streamline 的 DLL（含帧生成所需的五个附加组件）以及 Windows 的硬件加速 GPU 调度；FSR 3 在任何显卡上都能跑，需要 amd_fidelityfx_vk.dll v1.1.4（放在启动器旁的 upscalers\fsr）。
Keeps the game clock exact when frames are uneven: the game's step plus a quarter of the time it still owes. = 在帧时间不均时让游戏时钟保持精确：按游戏自身的步长，再加上它尚欠时间的四分之一。
Mouse controls = 鼠标操作
Automatic: moving or clicking the mouse switches the game to its mouse controls, a key or the controller switches back. Always: the game stays in its mouse controls. Off: the game never sees a mouse. = 自动：移动或点击鼠标会把游戏切到鼠标操作，按任意键或动手柄则切回。始终：游戏一直停留在鼠标操作。关闭：游戏完全看不到鼠标。
Mouse speed = 鼠标速度
How far the game's cursor and camera move per mouse count, before the game's own speed settings. = 在游戏自身速度设置之前，每单位鼠标计数让游戏的准星与镜头移动多远。
Wake distance = 唤醒距离
How far the mouse must move (counts, within a quarter second) to switch to mouse controls. = 鼠标需要移动多远（以计数计，限四分之一秒内）才切换到鼠标操作。
Capture the mouse = 捕获鼠标
While the game is in its mouse controls the Windows pointer is hidden and held in the window (the game draws its own cursor). A key, the controller, Alt+Tab or F1 frees it. = 游戏处于鼠标操作时，Windows 指针会被隐藏并锁定在窗口内（游戏自己绘制光标）。按任意键、动手柄、Alt+Tab 或 F1 即可释放。
Now = 当前
Left / right or A to change. = 用左右方向键或 A 键更改。
The game's movies are decoded on the CPU (dav1d). Skip makes each one end at once, as a skip does. = 游戏的影片由 CPU 解码（dav1d）。「跳过」会让每段影片立刻结束，效果等同于跳过。
Frame rate log = 帧率日志
One line a second with the presented frame rate and the present pass's GPU time ([gfx] log_fps). = 每秒输出一行，包含实际呈现的帧率与呈现通道的 GPU 时间（[gfx] log_fps）。
Play status log = 运行状态日志
One line a second with play mode's input state ([play] log_status). = 每秒输出一行，记录游玩模式的输入状态（[play] log_status）。
Frame summary log = 帧统计日志
Frames, mean and 1% low fps, worst frame ([diag] hitch_summary_s). = 帧数、平均帧率与 1% 最低帧率、最差帧（[diag] hitch_summary_s）。
