Automatic: DualSense haptics on a cable, HD Rumble for a Switch Pro Controller, the standard rumble for anything else. A mode change applies at once; if a backend cannot start, the standard rumble takes over. = 自动：有线连接的 DualSense 用触觉反馈，Switch Pro 手柄用 HD Rumble，其它手柄用普通震动。切换模式立即生效；后端无法启动时自动改用普通震动。
For the haptic backends. Left at -1 the haptics follow the rumble strength above instead, so an untouched controls.ini keeps one strength knob; 0 silences them. = 只作用于触觉后端。保持 -1 时改用上面的震动强度，所以没改过的 controls.ini 只有一个强度旋钮；0 表示静音。
